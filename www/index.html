<!DOCTYPE html>
<html>
<div class="webapp">
<head>
    <title>Therminator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js,default.js"></script>  
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>    
    <h1>Therminator Control Panel</h1>
    <!-- update this span when changing relay states to on/off -->
    <h2>Status: <span id="label_relay_pwr_status">not initialized</span></h2>
    
<!--    <div class="enablecontrol">
      <table border = 0>
          <td><button type="button" disabled id="button_enable_relay_pwr" onclick="enablechannelpwr()">Enable</button></td>
          <td><button type="button" disabled id="button_disable_relay_pwr" onclick="disablechannelpwr()">Disable</button></td>
      </table>
    </div>
-->
    <div class="tab">
    <table id="tabtable">
      <tr>
        <td class = "tabselect"><button class="tablinks" type="button" id="button_main_tab" onclick="show_tab(event, 'manual_tab')">Manual mode</button></td>
        <td class = "tabselect"><button class="tablinks" type="button" id="button_mode_tab" onclick="show_tab(event, 'mode_tab')">Thermostat mode</button></td>
        <td class = "tabselect"><button class="tablinks" type="button" id="button_settings_tab" onclick="show_tab(event, 'settings_tab')">Settings</button></button></button></td>
      </tr>
    </table>
    </div>
    
    
    <div id="manual_tab" class="tabcontent">
      
      <!--
      <table border = 0>
          <tr><button type="button" onclick="set_channel([{channel : 0, enable : 0}, {channel: 1, enable: 0}, {channel: 2, enable: 0}, {channel: 3, enable: 0}])">All Off</button></th>
          <tr><button type="button" onclick="set_channel([{channel : 0, enable: 0}, {channel: 1, enable: 1}, {channel: 2, enable: 0}, {channel: 3, enable : 0}])">First Stage</button></th>
          <tr><button type="button" onclick="set_channel([{channel : 0, enable: 0}, {channel: 1, enable: 1}, {channel: 2, enable: 1}, {channel: 3, enable : 0}])">Second Stage</button></th>
          <tr><input type="checkbox" name="ActivateGOB" label="Activate G/O/B" value="0">Activate G/O/B</input></tr>
      </table>
      -->
      <table border=1px id="controltable">
          <tr>
              <th id="channel0_label">R (PWR ⚠)</th>
              <th id="channel1_label">W1/Y1</th>
              <th id="channel2_label">W2/Y2</th>
              <th id="channel3_label">G/O/B </th>
          </tr>
          <tr>
              <td class="controlcell" id="channel0_control">
                   <button type="button" class="controlswitch" disabled id="button_channel0" onclick="set_channel([{channel : 0, enable : 1}])">ON ⚠</button>
                   <br>
                   <button type="button" class="controlswitch" disabled id="button_channel0_disable" disabled onclick="set_channel([{channel : 0, enable : 0}])">OFF</button>
              </td>
              <td class="controlcell" id="channel1_control">
                   <button type="button" class="controlswitch" disabled id="button_channel1" onclick="set_channel([{channel : 1, enable : 1}])">ON</button>
                   <br>
                   <button type="button" class="controlswitch" disabled id="button_channel1_disable" disabled onclick="set_channel([{channel : 1, enable : 0}])">OFF</button>
              </td>
              <td class="controlcell" id="channel2_control">
                  <button type="button" class="controlswitch" disabled id="button_channel2" onclick="set_channel([{channel : 2, enable : 1}])">ON</button>
                  <br>
                  <button type="button" class="controlswitch" disabled id="button_channel2_disable" disabled onclick="set_channel([{channel : 2, enable : 0}])">OFF</button>
              </td>
              <td class="controlcell" id="channel3_control">
                 <button type="button" class="controlswitch" disabled id="button_channel3" onclick="set_channel([{channel : 3, enable : 1}])">ON</button>
                 <br>
                 <button type="button" class="controlswitch" disabled id="button_channel3_disable" disabled onclick="set_channel([{channel : 3, enable : 0}])">OFF</button>
              </td>
          </tr>
      </table>
    </div>
    <div class="mode_tab">
      
    </div>
    <div class="settings_tab">
      
      
    </div>
</body>
</div>
</html>
